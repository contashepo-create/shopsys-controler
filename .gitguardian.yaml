# إعداد GitGuardian / ggshield للمستودع (صيغة v2).
#
# السياق: ماسح GitGuardian رفع تنبيهاً (Generic Password) على قيمة اختبارية ثابتة كانت
# في app/tests/core.test.ts — ولم تكن سرّاً حقيقياً، لكن مكانها الصحيح ألا تُكتب أصلاً:
# أُزيلت من الكود، وصارت عينات الاختبار تُبنى وقت التشغيل (انظر TEST_PASSPHRASE هناك).
#
# هذا الملف يضبط ggshield في الجهاز/CI. أما تكامل GitHub App فلِلوحة GitGuardian نفسها
# إعداداتها (Path exclusions / Ignore rules) — لا يقرأ هذا الملف.
version: 2

secret:
  # مجلد الاختبارات يحتوي عينات ثابتة مقصودة (كلمة مرور وهمية، متجه توقيع ذهبي بمفتاح
  # اختباري) — ليست اعتمادات حقيقية ولا تُستخدم في التطبيق. ماسحنا الخاص
  # (npm run verify:secrets) يفحص المستودع كله — بما فيه هذا المجلد — ولا يُستثني منه شيء.
  ignored_paths:
    - 'app/tests/**/*'
    # سكربت تحقق نواة الترخيص يحمل «المتجه الذهبي» نفسه: مفتاحا توقيع اختباريان
    # (خاص وعام) مثبّتان عن قصد ليكشف أي تغيير في صيغة التوقيع. ليسا مفتاح المالك.
    - 'app/scripts/verify_license_core.mjs'

  show_secrets: false
