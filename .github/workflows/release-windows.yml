name: إصدار ويندوز

# يُشغَّل تلقائياً عند دفع وسم إصدار (v0.1.0 مثلاً)، أو يدوياً من تبويب Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار للوسم (اتركه فارغاً ليُقرأ من app/package.json)'
        required: false
        default: ''

permissions:
  contents: write # إنشاء الإصدار ورفع الملفات

jobs:
  build-windows:
    name: بناء مثبّت ويندوز ونشره
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: تثبيت الحزم
        run: npm ci

      - name: بوابات التحقق (أسرار + نواة الترخيص + أنواع + اختبارات)
        run: npm run verify:all

      - name: بناء الواجهة ومثبّت NSIS
        run: npm run desktop:dist

      - name: حزمة محمولة (بلا تثبيت)
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/shopsys-controler-portable-$version.zip" -Force
          Get-ChildItem release | Select-Object Name, Length

      - name: رفع ملفات الحزمة كأثر للفحص
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            app/release/*.exe
            app/release/*.zip
            app/release/*.blockmap
            app/release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: إنشاء/تحديث إصدار GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          TAG="v$VERSION"
          echo "الإصدار: $TAG"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "مركز تحكم المطور — $TAG" \
              --notes "$(cat <<'NOTES'
          ## مركز تحكم المطور — Shopsys Controler (ويندوز)

          لوحة تحكم مكتبية لإدارة تراخيص واشتراكات تطبيق «تَحَكَّم»، تعمل على نفس بيانات
          بوت تليجرام بلا أي تعارض.

          ### التنزيل
          - **shopsys-controler-setup-x.y.z.exe** — المثبّت (يُنشئ اختصار «تحكم المطور» على سطح المكتب)
          - **shopsys-controler-portable-x.y.z.zip** — نسخة محمولة بلا تثبيت (فُك الضغط وشغّل `Shopsys Controler.exe`)

          ### أول تشغيل
          1. شاشة إنشاء الحساب: الاسم + رقم الهاتف + البريد + كلمة مرور اللوحة.
          2. الإعدادات ← Cloudflare: Account ID + API Token (صلاحية KV Read & Write) + namespace الخدمات.
          3. الإعدادات ← البوت: توكن البوت + معرّف محادثتك (لتصل رموز التحقق عند نسيان كلمة المرور).
          4. الإعدادات ← مفتاح التوقيع: الصق المفتاح الخاص (يُخزَّن مشفّراً على جهازك فقط).

          ### تنبيهات
          - البرنامج **غير موقّع رقمياً** — سيعرض ويندوز تحذير SmartScreen عند أول تشغيل
            (المزيد من المعلومات ← تشغيل على أي حال). التوقيع يتطلب شهادة مدفوعة.
          - المفتاح الخاص للتوقيع لا يُرفع إلى أي جهة، ولا يوجد أي نسخ احتياطي لبيانات العملاء.
          NOTES
            )" \
              --verify-tag 2>/dev/null || \
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "مركز تحكم المطور — $TAG" \
              --notes "مركز تحكم المطور — إصدار $TAG (ويندوز)"
          fi

          shopt -s nullglob
          FILES=(release/*.exe release/*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then echo "لا ملفات للرفع"; exit 1; fi
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "✅ تم رفع ${#FILES[@]} ملفاً إلى $TAG"
